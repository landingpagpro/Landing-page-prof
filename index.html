  font-family:'Cairo', ui-sans-system, system-ui, -apple-system, Segoe UI, sans-serif;
  background:#f1f5f9;
  color:#111827;
  font-weight:700
}

h1,h2,h3{
  font-weight:900;
  letter-spacing:-.01em;
  text-shadow:0 1px 0 rgba(255,255,255,.35)
}

#landing{
  font-family:'Cairo', ui-sans-system, system-ui, sans-serif;
  font-weight:700
}

#landing h1,#landing h2,#landing h3,#landing h4{
  font-weight:900 !important;
  color:#000000;
  text-shadow:0 0 1px rgba(0,0,0,.1)
}

#landing p,#landing li,#landing span,#landing td,#landing th,#landing summary,#landing label,#landing input,#landing button,#landing a{
  font-weight:700
}

#landing p,#landing li{
  font-size:var(--landing-body,24px) !important;
  line-height:2 !important
}

#landing li{
  font-size:22px !important
}

#landing span,#landing td,#landing th,#landing summary{
  font-size:var(--landing-body,24px) !important;
  line-height:2 !important
}

.landing-title{
  font-size:var(--landing-title,46px) !important;
  line-height:1.35 !important;
  font-weight:900 !important;
  letter-spacing:.2px;
  text-shadow:0 3px 18px rgba(0,0,0,.22);
  width:100% !important;
  text-align:right !important;
  word-break:normal;
  color:#000000
}

.landing-h2{
  font-size:38px !important;
  line-height:1.4 !important;
  font-weight:900 !important;
  letter-spacing:.2px;
  color:#000000 !important;
  width:100% !important;
  text-align:right !important;
  word-break:normal;
  text-shadow:0 0 1px rgba(0,0,0,.1)
}

.landing-p{
  font-size:var(--landing-body,24px) !important;
  line-height:2 !important;
  font-weight:700 !important;
  color:#000000 !important;
  letter-spacing:.2px;
  width:100% !important;
  text-align:justify !important;
  text-justify:inter-word;
  word-break:normal;
  padding:0 !important;
  margin-top:12px !important;
  text-shadow:0 0 1px rgba(0,0,0,.1)
}

#landing label{
  font-size:20px !important;
  font-weight:800 !important
}

#landing .premium-card p,#landing .premium-card li{
  font-size:var(--landing-body,24px) !important
}

.template-dark #landing h1,.template-dark #landing h2,.template-dark #landing h3,.template-dark .landing-h2{
  color:#f59e0b !important
}

.template-dark #landing .landing-p,.template-dark #landing p,.template-dark #landing li{
  color:#ffffff !important;
  text-shadow:0 0 1px rgba(255,255,255,.15)
}

.template-dark #landing .landing-title{
  color:#ffffff !important
}

.template-clean #landing .landing-title{
  color:#000000 !important
}

.landing-price{
  font-size:44px !important;
  line-height:1.1 !important;
  font-weight:900 !important
}

.offer-price{
  font-size:48px !important;
  line-height:1.1 !important;
  font-weight:900 !important;
  color:#16a34a
}

.example-hero{
  position:relative;
  overflow:hidden
}

.example-hero::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-2px;
  height:46px;
  background:var(--wave-fill,#f5f3ff);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  pointer-events:none
}

.example-model{
  border-radius:24px 24px 110px 110px;
  overflow:hidden
}

.example-product{
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 24px 50px rgba(0,0,0,.28)
}

.landing-btn{
  font-size:20px !important;
  font-weight:900 !important;
  padding:18px 44px !important;
  border-radius:999px !important
}

#landing button,#landing a{
  font-size:20px !important;
  font-weight:900 !important
}

#landing .offer-price{
  font-size:48px !important
}

.template-dark .landing-p{
  color:#f9fafb !important
}

.template-dark .landing-h2{
  color:#f59e0b !important
}

.template-clean .landing-p{
  color:#1f2937 !important
}

.template-dark .premium-card{
  background:#1f2937 !important;
  border:2px solid #f59e0b !important;
  color:#f9fafb !important
}

.template-clean .premium-card:nth-child(even){
  background:#f9fafb !important
}

.template-clean .landing-title{
  font-family:Georgia,serif !important
}

#landing,#landing *{
  min-height:0
}

#landing .premium-card{
  background:#ffffff !important
}

.template-dark #landing .premium-card{
  background:#1f2937 !important
}

.premium-card{
  border-radius:20px !important;
  border:1px solid rgba(0,0,0,.05) !important;
  box-shadow:0 10px 28px rgba(0,0,0,.10) !important;
  transition:transform .25s ease, box-shadow .25s ease;
  width:100% !important
}

.premium-card:hover{
  transform:translateY(-3px);
  box-shadow:0 28px 70px rgba(0,0,0,.16) !important
}

#landing img{
  width:100% !important;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

#landing .landing-p,#landing p{
  max-width:none !important
}

input,textarea,select{
  font-family:'Cairo', sans-serif
}

html{
  direction:rtl
}

input,textarea,select{
  outline:none
}

input:focus,textarea:focus,select:focus{
  border-color:#6366f1 !important;
  box-shadow:0 0 0 3px rgba(99,102,241,.15)
}

.rich-editor:empty:before{
  content:attr(data-placeholder);
  color:#94a3b8;
  font-weight:700
}

.rich-editor [data-pill]{
  display:inline-flex !important;
  align-items:center;
  gap:6px;
  vertical-align:middle
}

.rich-editor{
  white-space:pre-wrap;
  word-break:break-word
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-1deg)
  }

  50%{
    transform:translateY(-12px) rotate(1deg)
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.floaty{
  animation:floaty 5s ease-in-out infinite
}

.pop{
  animation:pop .25s ease
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:99px
}

#landing h1{
  font-size:42px !important;
  line-height:1.35 !important;
  font-weight:900 !important
}

#landing h2{
  font-size:32px !important;
  line-height:1.4 !important;
  font-weight:900 !important
}

#landing p{
  font-size:22px !important;
  line-height:2 !important
}

#landing{
  width:100%;
  margin-left:auto;
  margin-right:auto
}

#landing[data-device="mobile"]{
  max-width:375px !important
}

#landing[data-device="desktop"]{
  max-width:880px !important
}

#landing .price,#landing .landing-price{
  font-size:44px !important
}

#landing a,#landing button{
  font-size:18px !important
}
